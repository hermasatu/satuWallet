// payload = array argumen fungsi backend, mis. callBackend('api_saveTransaction',[actionId, tx])
async function callBackend(action,payload=[]){
 const session=getSess();
 if(hasGas()) // dibuka dari web app GAS: satu pintu publik "gateway" (sesi tetap divalidasi server)
  return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error((e&&e.message)||e))).gateway(action,payload,session));
 if(!API_URL)throw new Error('API_URL belum diisi');
 const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,args:payload,session})});
 if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function rcFail(rc){const f=(rc&&rc.failed)||[];if(!f.length)return;setTimeout(()=>alert('PERHATIAN: '+f.length+' baris GAGAL dicatat (belum tersimpan):\n\n'+f.slice(0,15).map(x=>'• '+x.date+' · '+x.merchant+' · '+rp(x.amount)+'\n   '+x.error).join('\n')+(f.length>15?'\n…dan '+(f.length-15)+' lainnya':'')+'\n\nPerbaiki lalu catat ulang baris tersebut.'),400)}
async function call(action,payload){const r=await callBackend(action,payload);
 if(!r||!r.ok){const m=(r&&r.error)||'Permintaan gagal';if(r&&r.status===401&&!$('#au'))logout(false,'Sesi berakhir. Silakan masuk lagi.');throw new Error(m)}return r}
