 catch(e){if(o.undo)o.undo();render();
  if(/^DUP:/.test(e.message)&&o.args&&o.args[1]&&!o.args[1].Force_Dup){const ok=await sure({title:'Kemungkinan duplikat',body:E(e.message.slice(4)),yes:'Tetap simpan',no:'Batal'});if(ok){o.args[1].Force_Dup=true;return mutate(o)}return null}

const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,aug:8,ags:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
const DRE=/^(\d{1,2})[\/\-. ]([A-Za-z]{3,9}|\d{1,2})(?:[\/\-. ](\d{4}|\d{2}))?(?=\s)/;
const HDRKW=/tanggal|tgl|transaksi|keterangan|uraian|deskripsi|description|date|jumlah|amount|nominal|rincian|mutasi|debet|kredit|saldo|posting/g;
const STATIC_RE=/^(halaman|page|hal\.?)\s*\d*|^\d+\s*(\/|dari|of)\s*\d+$/i,NOISE_KW=/saldo|total|subtotal|jumlah|tagihan|pembayaran|minimum|limit|bunga|ringkasan|periode|cetak|jatuh tempo|poin|reward|sisa|tunggakan|denda/i;

 return parseFloat((dec>=0?s.slice(0,dec):s).replace(/[.,]/g,'')+(dec>=0?'.'+s.slice(dec+1):''))||0}
const toks=l=>{const o=[],re=/\S+/g;let m;while(m=re.exec(l))o.push({t:m[0],s:m.index,e:m.index+m[0].length});return o};
function amtTok(t){let x=t.replace(/^(Rp\.?|IDR|USD|SGD)/i,''),mk='',neg=false;const mm=x.match(/^(.*?)(CR|DB|DR)\.?$/i);if(mm){x=mm[1];mk=mm[2].toUpperCase()}

function scanDates(l){const out=[];let m;const r1=/\b(\d{4})-(\d{2})-(\d{2})\b/g;while(m=r1.exec(l))out.push({iso:m[0],s:m.index,e:m.index+m[0].length});
 const r2=/\b(\d{1,2})[\/\-. ]([A-Za-z]{3,9}|\d{1,2})[\/\-. ](\d{4}|\d{2})\b/g;while(m=r2.exec(l)){const x=pDate(m[1],m[2],m[3]);if(x&&!out.some(o=>m.index<o.e&&m.index+m[0].length>o.s))out.push({iso:x,s:m.index,e:m.index+m[0].length})}return out.sort((a,b)=>a.s-b.s)}
function scanAmts(l){const T=toks(l),out=[],ds=scanDates(l);for(let i=0;i<T.length;i++){const a=amtTok(T[i].t);if(!a||ds.some(d=>T[i].s<d.e&&T[i].e>d.s))continue;out.push({v:a.v,s:T[i].s,e:T[i].e})}return out}
function tailNums(r){const T=toks(r),out=[];let i=T.length-1;while(i>=0&&out.length<3){let mk='',j=i;if(/^(CR|DB|DR)\.?$/i.test(T[j].t)&&j>0){mk=T[j].t.slice(0,2).toUpperCase();j--}const a=amtTok(T[j].t);if(!a)break;out.push({v:a.v,neg:a.neg,mk:mk||a.mk,start:T[j].s});i=j-1}return out}
function rowRest(l,n,ref){let r=l.trim();const d=[];for(let i=0;i<n;i++){const m=r.match(DRE);if(!m)break;const x=pDate(m[1],m[2],m[3],ref);if(!x)break;d.push(x);r=r.slice(m[0].length).trim()}return{d,r}}
const maskTokens=l=>(l.match(/[0-9Xx*•]{4}(?:[\s\-]?[0-9Xx*•]{4}){2,3}/g)||[]).map(x=>x.replace(/\D/g,'').slice(-4));

/* PDF -> baris: potongan teks digabung per baris visual dengan spasi sesuai jarak horizontal; jeda vertikal besar = baris kosong */
function joinItems(it){it.sort((a,b)=>a.x-b.x);let s='',px=null,pw=0;it.forEach(i=>{if(px!==null){const gap=i.x-(px+pw);if(gap>Math.max(1.2,i.fs*.18)&&!/\s$/.test(s)&&!/^\s/.test(i.s))s+=' '}s+=i.s;px=i.x;pw=i.w});return s.replace(/\s+/g,' ').trim()}
async function pdfLines(doc){const lines=[],gaps=new Set(),pagesOf=[];
 for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent();
  const its=tc.items.filter(i=>i.str&&i.str.trim()!=='').map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width,fs:Math.abs(i.transform[3])||i.height||10})).sort((a,b)=>b.y-a.y||a.x-b.x),rows=[];
  its.forEach(i=>{const r=rows[rows.length-1];if(r&&Math.abs(r.y-i.y)<=Math.max(2.5,i.fs*.45))r.items.push(i);else rows.push({y:i.y,items:[i],fs:i.fs})});
  let py=null,pf=0;rows.forEach(r=>{const t=joinItems(r.items);if(!t)return;if(py!==null&&py-r.y>Math.max(pf,r.fs)*2.1&&lines.length)gaps.add(lines.length-1);lines.push(t);pagesOf.push(p);py=r.y;pf=r.fs});
  if(lines.length)gaps.add(lines.length-1)}

async function readDoc(f,pw){

  const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer(),password:pw||undefined}).promise;o.kind='pdf';o.doc=doc;Object.assign(o,await pdfLines(doc));return o}

const txtHtml=o=>`<pre class="txtv">${o.lines.map((l,i)=>`<i>${String(i+1).padStart(3,'0')}</i>  ${E(l)}`+(o.gaps&&o.gaps.has(i)?'\n':'')).join('\n')}</pre>`;

/* ===== FORMAT TERSIMPAN: anchors (pengenal), penerapan aturan, dan belajar dari hasil AI ===== */
function makeAnchors(o){const cnt={},pg={};o.lines.forEach((l,i)=>{const s=normAnchor(l),w=s.split(' ');if(s.length<8||s.length>50||w.length<2||w.length>8)return;cnt[s]=(cnt[s]||0)+1;(pg[s]=pg[s]||new Set()).add(o.pagesOf[i]||1)});
 const kw=/tanggal|transaksi|keterangan|jumlah|tagihan|pembayaran|minimum|limit|kartu|rincian|saldo|total|rekening|mutasi|statement|periode|bank|jatuh tempo|cetak|credit|debit|kredit|debet/;
 return Object.keys(cnt).map(s=>({s,sc:(pg[s].size>1?3:0)+(kw.test(s)?2:0)+Math.min(cnt[s],3)*.2})).sort((a,b)=>b.sc-a.sc).slice(0,50).map(x=>x.s)}
/** baris yang berulang di >1 halaman (header / footer) — tidak dianggap catatan transaksi */
function makeRepeat(o){const pg={};o.lines.forEach((l,i)=>{const s=normAnchor(l);if(s.length>=4)(pg[s]=pg[s]||new Set()).add(o.pagesOf[i]||1)});return Object.keys(pg).filter(k=>pg[k].size>1)}
function numbered(o){const out=[];let pg=0;o.lines.forEach((l,i)=>{const p=o.pagesOf[i]||1;if(p!=pg){pg=p;out.push('=== HALAMAN '+p+' ===')}out.push('['+(i+1)+'] '+l);if(o.gaps.has(i))out.push('')});return maskPan(out.join('\n'))}
const GEN_ROWS={dates:2,amtIdx:0,notes:true,start:[],noise:[],tail:[]};
function parseRow(l,P,ref){const{d,r}=rowRest(l,P.dates||2,ref);if(!d.length)return null;const tn=tailNums(r),a=tn[P.amtIdx||0];if(!a||!(a.v>0))return null;
 let m=r.slice(0,a.start).replace(/\s+/g,' ').trim();if(!/[A-Za-z]{2}/.test(m))return null;
 if(P.tail&&P.tail.length){const w=m.split(' ');while(w.length>1&&P.tail.includes(w[w.length-1].toLowerCase()))w.pop();m=w.join(' ')}
 return{dt:d[0],bk:d[1]||d[0],m,a:a.v,cr:a.mk=='CR'||(a.neg&&a.mk!='DB'&&a.mk!='DR')}}
const isHdr=l=>{const n=normAnchor(l),m=n.match(HDRKW)||[];return new Set(m).size>=2};
function applyRows(o,P,mode,ref){const L=o.lines,rows=[],crr=[];let st=0;
 if(P.start&&P.start.length){const k=L.findIndex(l=>{const n=normAnchor(l);return P.start.every(w=>n.includes(w))});st=k<0?0:k}
 const anch=new Set(o.repeat||[]);
 for(let i=st;i<L.length;i++){const x=parseRow(L[i],P,ref);if(!x)continue;const nm=normAnchor(x.m);if((P.noise||[]).some(z=>nm.startsWith(z)))continue;
  let t;if(mode=='CC'){if(x.cr){if(/cashback|rebate|reward/i.test(x.m))t='Cashback';else{crr.push({dt:x.dt,m:x.m,a:x.a});continue}}else t=kind(x.m)}
  else t=x.cr?'Masuk':/tarik tunai|cash withdrawal|\batm\b/i.test(x.m)?'Tarik tunai':'Keluar';
  const nt=[];if(P.notes!==false&&!(o.gaps&&o.gaps.has(i)))for(let j=i+1;j<L.length&&nt.length<4;j++){const q=L[j];if(parseRow(q,P,ref)||STATIC_RE.test(q)||anch.has(normAnchor(q))||isHdr(q))break;nt.push(q);if(o.gaps&&o.gaps.has(j))break}
  const[a,b]=instOf(x.m);rows.push({dt:x.dt,bk:x.bk,m:x.m,a:x.a,t,ic:t=='Cicilan'?a:'',it:t=='Cicilan'?b:'',pg:(o.pagesOf||[])[i]||0,nt:nt.join('\n'),rf:'',ln:i+1})}
 return{rows,creditRows:crr}}
function tokensOf(l,k){if(k=='d')return scanDates(l).map(x=>x.iso);if(k=='a')return scanAmts(l).map(x=>x.v);return maskTokens(l)}
const findSig=(L,sig)=>{let k=L.findIndex(l=>normAnchor(l)===sig);if(k<0)k=L.findIndex(l=>normAnchor(l).includes(sig));return k};
function applySum(L,sr){const o={};Object.keys(sr||{}).forEach(f=>{const r=sr[f],k=findSig(L,r.sig);if(k<0)return;const l=L[k+r.up];if(l==null)return;const t=tokensOf(l,r.k);if(t[r.j]!=null)o[f]=t[r.j]});return o}
function applyFormat(o,rl,mode){const s1=applySum(o.lines,rl.sum||{}),ref=s1.statementDate||'',rr=applyRows(o,rl.rows||GEN_ROWS,mode,ref),nz=v=>v!=null?v:null;
 return{rows:rr.rows,creditRows:rr.creditRows,credits:rr.creditRows.length,
  info:{name:(rl.card||{}).name||'',bank:(rl.card||{}).bank||'',last4:s1.last4||'',creditLimit:nz(s1.creditLimit),statementDay:s1.statementDate?+s1.statementDate.slice(8):null,dueDay:s1.dueDate?+s1.dueDate.slice(8):null},
  sum:{statementDate:s1.statementDate||null,dueDate:s1.dueDate||null,totalDue:nz(s1.totalDue),minimumPayment:nz(s1.minimumPayment),previousBalance:nz(s1.previousBalance),period:s1.statementDate?s1.statementDate.slice(0,7):null}}}
function locate(L,val,k,hint){const order=[],seen=new Set();if(hint>0)for(let d=0;d<=3;d++){order.push(hint-1+d);if(d)order.push(hint-1-d)}L.forEach((_,i)=>order.push(i));
 for(const i of order){if(i<0||i>=L.length||seen.has(i))continue;seen.add(i);const t=tokensOf(L[i],k),j=t.findIndex(v=>k=='a'?Math.abs(v-val)<1:v==val);if(j>=0)return{i,j}}return null}
function ruleFor(L,pos,k){for(let up=0;up<=3&&pos.i-up>=0;up++){const s=normAnchor(L[pos.i-up]);if(s.replace(/\s/g,'').length>=4)return{sig:s.slice(0,60),up,j:pos.j,k}}return null}
function testRows(L,A,mode){const m={};L.forEach(r=>{const k=r.dt+'|'+Math.round(r.a);(m[k]=m[k]||[]).push(r)});let hit=0,tb=0;
 A.forEach(r=>{const a=m[r.dt+'|'+Math.round(r.a)];if(a&&a.length){const x=a.shift();hit++;if(mode=='ACCOUNT'&&x.t!=r.t)tb++}});
 return hit>=A.length*.85&&(L.length-hit)<=Math.max(2,A.length*.15)&&tb<=A.length*.15}
/** Belajar aturan baca dari hasil AI (nomor baris + nilai) lalu uji ulang pada dokumen yang sama; null bila tidak meyakinkan */
function learnFormat(o,ai,mode){
 const L=o.lines,air=ai.rows||[],sum=ai.summary||{},card=ai.card||{},refs=ai.refs||{},ref=sum.statementDate||'';if(air.length<2)return null;
 const used=new Set(),hits=[],has=(c,a)=>scanAmts(L[c]).some(x=>Math.abs(x.v-a)<1),lead=(l,n)=>rowRest(l,n,ref).d;
 air.forEach(r=>{let i=-1;if(r.ln>0)for(const d of[0,1,-1,2,-2]){const c=r.ln-1+d;if(c>=0&&c<L.length&&!used.has(c)&&DRE.test(L[c].trim())&&has(c,r.a)){i=c;break}}
  if(i<0)for(let c=0;c<L.length;c++){if(used.has(c)||!DRE.test(L[c].trim())||!has(c,r.a))continue;const ds=lead(L[c],2);if(ds.includes(r.dt)||ds.includes(r.bk)){i=c;break}}
  if(i>=0){used.add(i);hits.push({i,r})}});
 if(hits.length<Math.max(2,air.length*.6))return null;
 const two=hits.filter(h=>lead(L[h.i],2).length>=2).length,dates=two>=hits.length*.5?2:1;
 let amtIdx=-1,best=0;for(let k=0;k<3;k++){const c=hits.filter(h=>{const t=tailNums(rowRest(L[h.i],dates,ref).r)[k];return t&&Math.abs(t.v-h.r.a)<1}).length;if(c>best){best=c;amtIdx=k}}
 if(amtIdx<0||best<hits.length*.7)return null;
 const P={dates,amtIdx,notes:air.some(r=>r.nt),start:[],noise:[],tail:[]};
 const first=Math.min(...hits.map(h=>h.i));for(let i=first-1;i>=Math.max(0,first-8);i--){if(isHdr(L[i])&&!parseRow(L[i],P,ref)){P.start=normAnchor(L[i]).split(' ').filter(w=>w.length>=3).slice(0,5);break}}
 const hs=new Set(hits.map(h=>h.i));
 L.forEach((l,i)=>{if(hs.has(i))return;const x=parseRow(l,P,ref);if(x&&!x.cr&&NOISE_KW.test(x.m)){const z=normAnchor(x.m).split(' ').slice(0,3).join(' ');if(z.length>=4&&!P.noise.includes(z)&&P.noise.length<20)P.noise.push(z)}});
 const fr={};hits.forEach(h=>{const x=parseRow(L[h.i],{...P,tail:[]},ref);if(!x)return;const lm=x.m.toLowerCase(),am=h.r.m.toLowerCase();if(lm!=am&&lm.startsWith(am))x.m.slice(am.length).trim().split(/\s+/).forEach(w=>{const lw=w.toLowerCase();if(w&&w.length<=12&&/^[a-z]+$/i.test(w)){fr[lw]=(fr[lw]||0)+(/^[A-Z]{2,3}$/.test(w)?2:1)}})});
 P.tail=Object.keys(fr).filter(w=>fr[w]>=2).slice(0,15);
 const sr={};[['statementDate',sum.statementDate,'d'],['dueDate',sum.dueDate,'d'],['totalDue',sum.totalDue,'a'],['minimumPayment',sum.minimumPayment,'a'],['previousBalance',sum.previousBalance,'a'],['creditLimit',card.creditLimit,'a'],['last4',card.last4,'m']].forEach(([f,v,k])=>{
  if(v==null||v===''||(k=='a'&&!(v>0)))return;const pos=locate(L,v,k,refs[f]||0);if(pos){const r=ruleFor(L,pos,k);if(r)sr[f]=r}});
 const rules={v:1,mode,rows:P,sum:sr,card:{name:card.name||'',bank:card.bank||''}};
 const t=applyFormat(o,rules,mode);if(!testRows(t.rows,air,mode))return null;
 return{rules,bank:card.bank||'',name:(card.name||card.bank||'Format')+(mode=='CC'?'':' (mutasi)'),summaryFields:Object.keys(sr).length}}

/* ----- Smart Autofill: format tersimpan (backend) -> bila belum ada, AI (teks saja) + simpan format baru ----- */
async function autofill(){const o=R.o;if(o.lines.length<5)return toast('Dokumen tidak punya teks yang bisa dibaca');
 R.pane='t';R.busy='Mencari format tersimpan di backend…';R.aiErr='';render();
 let found=null;try{found=(await call('api_findFormat',[{mode:R.mode,anchors:o.anchors}])).format}catch(e){}
 if(found&&found.Rules){const res=applyFormat(o,found.Rules,R.mode);
  if(res.rows.length){fillFrom(res,{src:'saved',id:found.ID,name:found.Name,hits:found.Hits});return}
  R.fmtMiss=found}
 R.busy=found?'Format tersimpan tidak cocok dengan dokumen ini — membaca dengan AI (teks saja)…':'Format belum tersimpan — membaca dengan AI sekali (teks saja, gambar & iklan diabaikan)…';render();
 let ai=null;try{ai=await call('api_aiExtract',[{mode:R.mode,text:numbered(o)}])}catch(e){R.aiErr=e.message}
 if(ai){const ln=learnFormat(o,ai,R.mode);R.sumAI=ai.summary;
  fillFrom({rows:ai.rows,creditRows:ai.creditRows||[],credits:ai.credits||0,info:ai.card,sum:ai.summary},ln?{src:'learned',rules:ln.rules,name:ln.name,bank:ln.bank,replaceId:found?found.ID:'',fields:ln.summaryFields}:{src:'ai',noLearn:true});return}
 const gen=applyFormat(o,{rows:GEN_ROWS,sum:{},card:{}},R.mode);fillFrom(gen,{src:'generic'})}
function fillFrom(res,fmt){
 R.rows=res.rows.map(x=>({id:++uid,dt:x.dt,bk:x.bk||x.dt,m:x.m,a:x.a,t:x.t,k:memCat(x.m,x.t)||x.k||autoCat(x.m,x.t),ic:x.ic||'',it:x.it||'',pg:x.pg||0,nt:x.nt||'',rf:x.rf||'',lb:'',py:memPy(x.m)}));R.gok=0;
 R.info=res.info||null;R.sum=res.sum||null;R.cr=res.credits||0;R.crRows=res.creditRows||[];R.fmt=fmt;R.busy='';
 const s=R.sum||{};R.bp=R.bp||s.period||TODAY().slice(0,7);if(s.totalDue!=null)R.bt=s.totalDue;if(s.minimumPayment!=null)R.bm=s.minimumPayment;if(s.dueDate)R.bdd=s.dueDate;if(s.statementDate){R.bpd=s.statementDate;R.bp=R.bpd.slice(0,7)}
 const i=R.info||{};if(!R.t&&i.last4){const m=R.mode=='CC'?S.cards.find(c=>c.Last4==i.last4):S.accounts.find(a=>a.last4==i.last4&&['CASH','BANK','EWALLET'].includes(a.type));if(m)R.t=m.ID||m.id}
 R.st='prev';R.pane='t';render();
 if(R.mode=='CC'&&!R.t&&(i.name||i.last4))ncModal();else if(!R.rows.length)toast('Tidak ada baris terbaca — tambahkan manual');pvM()}

/* ----- pembayar & memori merchant ----- */
const PY=c=>(S.payers||[]).find(p=>p.Code==c)||{Code:c||'?',Name:c||'?',Color:'#64748b'};
const pyOk=c=>c&&(S.payers||[]).some(p=>p.Code==c)?c:'';
const selfPy=()=>((S.payers||[]).find(p=>p.Self)||(S.payers||[])[0]||{}).Code||'HER';
const guessPy=n=>{n=String(n||'').toLowerCase();if(/payment|pembayaran/.test(n))return '';if(/affiliate|komisi|sample|sampel/.test(n)&&pyOk('AFL'))return 'AFL';if(/gudang|iklan|stock|stok|kulak|supplier|packing/.test(n)&&pyOk('WGC'))return 'WGC';if(/bisnis|kantor|cicilan|admin|iuran|biaya/.test(n)&&pyOk('BIZ'))return 'BIZ';return selfPy()};
const catPy=id=>{const c=catOf(id);if(!c.ID)return selfPy();const p=c.Parent_ID?catOf(c.Parent_ID):null;return pyOk(c.Default_Payer)||(p&&pyOk(p.Default_Payer))||guessPy((p&&p.ID?p.Name+' ':'')+c.Name)};
const pyChip=c=>{const p=PY(c);return `<span class="pyc" style="--pc:${p.Color}" title="${E(p.Name)}">${E(p.Code)}</span>`};
const memK=m=>String(m||'').replace(/\d+/g,' ').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,24);
const memOf=m=>{const k=memK(m);return k.length>=3&&S.mem?S.mem[k]:null};
function memCat(m,t){if(t=='Masuk'||t=='Tarik tunai'||t=='Cashback')return '';const x=memOf(m),c=x&&x[0]?catOf(x[0]):{};return c.ID&&c.Kind!='Pemasukan'?c.ID:''}
const memPy=m=>{const x=memOf(m);return x&&pyOk(x[1])||''};
function pySel(r){const au=catPy(r.k);return `<select class="inp ti" title="Siapa yang menanggung" onchange="ue(${r.id},'py',this.value)" style="border-color:${PY(r.py||au).Color}"><option value="">Pembayar: otomatis · ${E(au)}</option>${(S.payers||[]).map(p=>`<option value="${p.Code}" ${r.py==p.Code?'selected':''}>${E(p.Code)} · ${E(p.Name)}</option>`).join('')}</select>`}

/* ----- Smart Match (Group Matcher): konfirmasi sebelum digabung ----- */
const gTxs=r=>{const m=r.mt||{};return typeof r.gd=='number'&&m.alts&&m.alts[r.gd]?m.alts[r.gd].txs||[]:m.txs||[]};
const gIds=r=>{const m=r.mt;if(!m||!m.group||r.gd==='reject')return null;return gTxs(r).map(t=>t.ID)};
const mOn=r=>!!(r.mt&&r.mt.st!='missing'&&!(r.mt.group&&r.gd==='reject'));
function gmB(r){const m=r.mt;
 if(r.gd==='reject')return `<div class="xs mu mt1">${ic('plus',12)} Smart Match ditolak — baris ini dicatat sebagai transaksi baru. <button class="btn3 xs" onclick="gdSet(${r.id})">Gabungkan lagi</button></div>`;
 const t=gTxs(r),n=(m.alts||[]).length;
 return `<div class="gm mt1"><div class="fx jb ac g1"><b class="xs gn">${ic('link',12)} Smart Match · 1 gesekan = ${t.length} pembelian</b>${m.tie?'<span class="pill am">ada kombinasi lain</span>':''}</div>
 <div class="xs mt1">${t.map(x=>`<div class="fx jb g2" style="padding:.08rem 0"><span>${E(tName(x))} <span class="mu">· ${fd(x.Date)}</span></span><b class="nw">${rp(x.Approx_IDR)}</b></div>`).join('')}</div>
 <div class="fx g1 fw mt1">${n?`<button class="btn2 sm" onclick="gdAlt(${r.id})">${ic('repeat',12)} Kombinasi ${typeof r.gd=='number'?r.gd+2:1}/${n+1}</button>`:''}<button class="btn2 rd sm" onclick="gdSet(${r.id},'reject')">Jangan gabungkan</button></div></div>`}
function gdLbl(r){if(r.lb&&!r.lbAuto)return;const t=r.gd==='reject'?[]:gTxs(r);r.lb=t.map(tName).join(' + ');r.lbAuto=t.length?1:0}
function gdSet(id,v){const r=R.rows.find(x=>x.id==id);if(!r)return;if(v===undefined)delete r.gd;else r.gd=v;R.gok=0;gdLbl(r);rowRf(id);const l=$('#gml');if(l)l.innerHTML=gmList()}
function gdAlt(id){const r=R.rows.find(x=>x.id==id),n=(r.mt.alts||[]).length;gdSet(id,typeof r.gd!='number'?0:r.gd+1<n?r.gd+1:undefined)}
function gdPick(id,v){gdSet(id,v===''?undefined:v==='reject'?'reject':+v)}
const gmList=()=>R.rows.filter(x=>x.mt&&x.mt.group).map(x=>{const t=gTxs(x),off=x.gd==='reject';
 return `<div class="sub mb1" style="${off?'opacity:.6':''}"><label class="fx as g2" style="cursor:pointer"><input type="checkbox" ${off?'':'checked'} onchange="gdSet(${x.id},this.checked?undefined:'reject')" style="margin-top:.25rem"><div class="f1"><div class="fx jb g2"><b class="sm">${fd(x.dt)} · ${E(x.m)}</b><b class="sm nw">${rp(x.a)}</b></div>
 ${off?'<div class="mu xs">Tidak digabung — dicatat sebagai 1 transaksi baru</div>':`<div class="xs mt1">= ${t.map(z=>`${E(tName(z))} <b>${rp(z.Approx_IDR)}</b>`).join(' + ')}</div>`}</div></label>
 ${!off&&(x.mt.alts||[]).length?`<select class="inp ti mt1" onchange="gdPick(${x.id},this.value)"><option value="" ${typeof x.gd!='number'?'selected':''}>Usulan utama${x.mt.tie?' (skor sama dengan alternatif)':''}</option>${x.mt.alts.map((a,i)=>`<option value="${i}" ${x.gd===i?'selected':''}>Alternatif ${i+1}: ${E((a.txs||[]).map(tName).join(' + '))}</option>`).join('')}</select>`:''}</div>`}).join('');
function gmModal(after){const L=R.rows.filter(x=>x.mt&&x.mt.group);if(!L.length){R.gok=1;return after?sv():null}
 const n=L.filter(x=>x.gd!=='reject').length,k=L.filter(x=>x.gd!=='reject').reduce((s,x)=>s+gTxs(x).length,0);
 mo(head('Konfirmasi Smart Match',`${n} gesekan kartu cocok dengan gabungan <b>${k} catatanmu</b> (kartu & tanggal sama, jumlahnya pas). Hilangkan centang bila ada yang tidak benar.`)+`<div id="gml">${gmList()}</div><div class="act"><button class="btn2" onclick="cm()">Kembali</button><button class="btn" onclick="gmOk(${after?1:0})">${ic('check',16)} ${after?'Cocokkan & simpan':'Cocokkan'}</button></div>`,'wd')}

 ${act.length?`<div class="grid g-2">${act.map(p=>`<div class="cd"><div class="qst">${ring(p.ev.pct,pCol(p.ev),70)}<div class="f1"><b class="sm">${E(p.Title)}</b><div class="mu xs">${E(p.cardName)}${p.last4?' ••'+E(p.last4):''} · ${p.ev.met?'<span class="gn">✓ tercapai</span>':p.ev.daysLeft+' hari lagi'}</div><div class="xs mt1">${E(p.Target_Text||'')}</div></div></div><div class="mt1">${p.ev.rules.map(ruleH).join('')}</div>${p.ev.cycleNote?`<div class="fmtb mt1 xs">${ic('cal',14)}<div>${E(p.ev.cycleNote)}</div></div>`:''}${p.ev.earned?`<div class="xs gn mt1" style="font-weight:600">Estimasi didapat: ${rp(p.ev.earned)}</div>`:''}</div>`).join('')}</div>`
 :`<div class="cd t-c" style="padding:1.6rem"><div class="pr mb1">${ic('target',30)}</div><b>Belum ada promo dipantau</b><p class="mu sm mt1">Tempel SnK promo (Ctrl+A dari web bank juga boleh) atau unggah PDF-nya. Aku rangkum target & pantau progresnya otomatis dari transaksimu.</p><button class="btn mt2" onclick="prAdd()">${ic('plus',16)} Tambah promo</button></div>`}`}
function advH(R0){if(!R0.results.length)return '<p class="mu sm mt2">Belum ada kartu aktif.</p>';const L=R0.results.slice(0,4);
 return `<div class="mt2">${!R0.hasPromo?'<div class="wn">Belum ada promo tersimpan — urutan di bawah hanya memperhatikan limit & tanggal cetak. Tambah promo agar sarannya tajam.</div>':''}${L.map((c,i)=>`<div class="sub mt1 fx as g2" style="${i==0&&c.score>0?'border-color:var(--gn)':''}"><span class="rank ${i==0&&c.score>0?'r1':''}">${i+1}</span><div class="f1"><div class="fx jb g2"><b class="sm">${E(c.name)} <span class="mu xs">••${E(c.last4||'')}</span></b>${c.score>0?`<span class="pill gn">nilai ±${jt(c.score)}</span>`:''}</div>${c.reasons.map(x=>`<div class="xs">• ${E(x)}</div>`).join('')}${c.warn.map(x=>`<div class="xs am">⚠ ${E(x)}</div>`).join('')}<div class="mu xs mt1">Tercetak di tagihan ±${fdd(c.printDate)}</div></div></div>`).join('')}</div>`}
async function advGo(){const a=pn(($('#ad_a')||{}).value);if(!(a>0))return toast('Isi nominal');ADV.a=a;ADV.busy=1;render();
 try{ADV.res=await call('api_advise',[{amount:a,channel:ADV.ch,merchant:ADV.m||'',date:ADV.d||TODAY()}])}catch(e){toast(e.message)}ADV.busy=0;render()}
/* promo */
function kvP(){const P=S.KP;if(!P)return spin('Memuat promo…');if(P.err)return `<div class="wn">${E(P.err)}</div>`;
 if(!P.promos.length)return `<div class="cd t-c mu" style="padding:2rem">Belum ada promo. <button class="btn3" onclick="prAdd()">Tambah dari SnK</button></div>`;
 return `<div class="grid g-2">${P.promos.map(promoCard).join('')}</div>`}
function promoCard(p){const e=p.ev,rw=p.reward||{},off=p.Status!='Aktif'||p.expired;
 return `<div class="cd" style="${off?'opacity:.6':''}"><div class="qst">${ring(e.pct,pCol(e),62)}<div class="f1"><b>${E(p.Title)}</b><div class="mu xs">${E(p.cardName)} · ${p.Period_Type=='RANGE'?fdd(p.Period_Start)+' – '+fdd(p.Period_End):p.Period_Type=='STATEMENT'?'per periode tagihan':'per bulan kalender'}${off?' · '+(p.expired?'berakhir':'nonaktif'):''}</div>${rw.value?`<span class="pill gn mt1">${rw.type=='MILES'?fg(rw.value)+' miles':'Hadiah '+rp(rw.value)}${rw.cap?' · maks '+rp(rw.cap):''}</span>`:''}</div></div>
 <div class="sub mt2"><div class="mu xs">Target</div><b class="sm">${E(p.Target_Text||'-')}</b></div>
 <div class="mt1">${e.rules.map(ruleH).join('')}</div>${e.cycleNote?`<div class="fmtb mt1 xs">${ic('cal',14)}<div>${E(e.cycleNote)}</div></div>`:''}
 ${p.prev?`<div class="xs mt1 ${p.prev.met?'gn':'mu'}">Periode lalu: ${p.prev.met?'✓ tercapai'+(p.prev.earned?' · '+rp(p.prev.earned):''):'tidak tercapai ('+p.prev.pct+'%)'}</div>`:''}
 ${p.Advice?`<div class="fmtb mt2">${ic('spark',16)}<div class="sm">${E(p.Advice)}</div></div>`:''}
 <details class="mt2"><summary class="btn3 sm" style="cursor:pointer">Rangkuman SnK lengkap</summary><div class="mt1">${(p.summary||[]).map(x=>`<div class="xs" style="padding:.15rem 0">• ${E(x)}</div>`).join('')}${(p.exclusions||[]).length?`<div class="xs mt1" style="font-weight:600">Tidak dihitung:</div>${p.exclusions.map(x=>`<div class="xs mu">– ${E(x)}</div>`).join('')}`:''}</div></details>
 <div class="fx g1 fw mt2"><button class="btn2 sm" onclick="prToggle('${p.ID}','${p.Status=='Aktif'?'Nonaktif':'Aktif'}')">${p.Status=='Aktif'?'Nonaktifkan':'Aktifkan'}</button><button class="btn2 rd sm" onclick="prDel('${p.ID}')">${ic('trash',13)} Hapus</button></div></div>`}
function prAdd(){FM.pr={text:''};
 mo(head('Tambah promo dari SnK','Tempel teks SnK — boleh Ctrl+A satu halaman web — atau unggah PDF. Aku rangkum jadi target yang jelas; teks mentahnya tidak ditampilkan.')+`<textarea id="pr_t" class="inp" rows="7" placeholder="Tempel SnK di sini…" oninput="FM.pr.text=''"></textarea>
 <div class="fx ac g1 fw mt1"><label class="btn2 sm" style="cursor:pointer">${ic('file',14)} Unggah PDF / TXT<input type="file" hidden accept=".pdf,.txt,text/plain,application/pdf" onchange="prFile(this.files[0])"></label><span id="pr_fn" class="mu xs"></span></div>
 <label class="lb" for="pr_c">Kartu</label><select id="pr_c" class="inp"><option value="">Deteksi otomatis dari SnK</option>${S.cards.filter(c=>c.Status=='Aktif').map(c=>`<option value="${c.ID}">${E(c.Name)} ••${E(c.Last4)}</option>`).join('')}</select>`+btns('prParse()',ic('spark',16)+' Rangkum dengan AI','id="pr_b"'),'wd')}
async function prFile(f){if(!f)return;const e=$('#pr_fn');e.textContent='Membaca '+f.name+'…';
 try{let t='';if(/\.pdf$/i.test(f.name)||f.type=='application/pdf'){const o=await readDoc(f,'');t=o.lines.join('\n')}else t=await f.text();
  if(t.trim().length<80)throw new Error('Teks tidak terbaca (PDF hasil scan?) — tempel teksnya saja');FM.pr.text=t;e.textContent='✓ '+f.name+' · '+fg(t.length)+' karakter siap dirangkum'}
 catch(x){e.textContent='';toast(x.name=='PasswordException'?'PDF dikunci password — buka dulu lalu salin teksnya':x.message)}}
async function prParse(){const text=FM.pr.text||($('#pr_t')||{}).value||'',cid=($('#pr_c')||{}).value||'';if(text.trim().length<80)return toast('Tempel teks SnK lengkap atau unggah PDF');
 const b=$('#pr_b');if(b){b.disabled=true;b.textContent='Merangkum…'}
 try{const r=await call('api_parsePromo',[{text,cardId:cid}]);FM.pr={...FM.pr,text,res:r.promo,cardId:r.cardId||cid,aid:uuid()};cm();prPreview()}
 catch(e){toast(e.message);if(b){b.disabled=false;b.innerHTML=ic('spark',16)+' Rangkum dengan AI'}}}
function prPreview(){const p=FM.pr.res,rw=p.reward||{};
 mo(head('Rangkuman promo','Cek sekilas lalu simpan — progresnya dihitung otomatis dari transaksimu.')+`<div class="cd kv"><b style="font-size:1.05rem">${E(p.title)}</b><div class="mu xs mt1">${p.periodType=='RANGE'?fdd(p.periodStart)+' – '+fdd(p.periodEnd):p.periodType=='STATEMENT'?'Per periode tagihan':'Per bulan kalender'}${rw.value?' · hadiah '+(rw.type=='MILES'?fg(rw.value)+' miles':rp(rw.value)):''}${rw.cap?' · maks '+rp(rw.cap):''}</div>
 <div class="sub mt2"><div class="mu xs">Target</div><b>${E(p.target||'-')}</b></div>
 <div class="mt2">${(p.summary||[]).map(x=>`<div class="sm" style="padding:.15rem 0">• ${E(x)}</div>`).join('')}</div>
 ${p.advice?`<div class="fmtb mt2">${ic('spark',16)}<div class="sm"><b>Disesuaikan untukmu:</b> ${E(p.advice)}</div></div>`:''}${(p.tips||[]).map(x=>`<div class="xs mt1">💡 ${E(x)}</div>`).join('')}</div>
 <label class="lb" for="pp_c">Kartu</label><select id="pp_c" class="inp"><option value="">Pilih kartu…</option>${S.cards.filter(c=>c.Status=='Aktif').map(c=>`<option value="${c.ID}" ${c.ID==FM.pr.cardId?'selected':''}>${E(c.Name)} ••${E(c.Last4)}</option>`).join('')}</select>
 <details class="mt2"><summary class="btn3 xs" style="cursor:pointer">Aturan terukur (${p.rules.length})</summary>${p.rules.map(r=>`<div class="xs mt1">• <b>${E(r.label||r.type)}</b> — ${r.type=='MIN_SPEND'?'min '+rp(r.amount):r.type=='MIN_COUNT'?'min '+r.count+'x':r.type=='MILES_RATE'?r.miles+' miles / '+rp(r.perAmount):(r.rate?Math.round(r.rate*1000)/10+'%':'bertingkat')+(r.cap?' · cap '+rp(r.cap):'')}${r.filters.channel!='ANY'?' · '+r.filters.channel.toLowerCase():''}${r.filters.weekendOnly?' · weekend':''}${r.filters.minAmount?' · min '+rp(r.filters.minAmount)+'/trx':''}${r.filters.distinctMerchantPerDay?' · merchant beda per hari':''}</div>`).join('')}${p.rules.length?'':'<div class="xs rd mt1">AI tidak menemukan syarat yang terukur — promo ini belum bisa dipantau otomatis.</div>'}</details>`+btns('prSave()','Simpan promo','id="pp_b"'),'wd')}

 try{await call('api_savePromo',[FM.pr.aid,{promo:FM.pr.res,cardId:cid,rawText:FM.pr.text}]);cm();toast('Promo dipantau');S.KP=null;loadKP();if(tab!='k')go('k')}catch(e){b.disabled=false;toast(e.message)}}

const mdl=s=>{const L=E(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let h='',ul=0;L.forEach(l=>{const m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!ul){h+='<ul>';ul=1}h+='<li>'+m[1]+'</li>'}else{if(ul){h+='</ul>';ul=0}h+=l.trim()?l+'<br>':''}});return h+(ul?'</ul>':'')};

function kvC(){return `<div class="cd" style="padding:.8rem"><div id="kcb" style="max-height:60vh;overflow:auto;padding:.2rem">${KC.length?KC.map(m=>`<div class="bub ${m.r}">${m.r=='a'?mdl(m.t):E(m.t)}${m.actions&&m.actions.length?`<div class="mt1">${m.actions.map(x=>`<span class="pill mt1" style="margin-right:.3rem">✓ ${E(x)}</span>`).join('')}</div>`:''}${m.learned&&m.learned.length?`<div class="mu xs mt1">${ic('spark',11)} Aku ingat: ${E(m.learned.join(' · '))}</div>`:''}</div>`).join(''):`<div class="mu sm t-c" style="padding:1.2rem">Tanya apa saja soal kartu, cashback, miles, tagihan, atau arus kasmu. Aku membaca data transaksi, promo & profilmu.</div>`}${KBUSY?`<div class="bub a mu"><span class="spin">${ic('repeat',14)}</span> Menganalisis…</div>`:''}</div>
 <div class="mt1">${QP.map(q=>`<button class="chip" onclick="kAsk(${E(JSON.stringify(q))},${q==QP[0]?"'PLAN'":"''"})">${E(q)}</button>`).join('')}</div>
 <div class="fx g1 mt1"><textarea id="kq" class="inp" rows="2" placeholder="Tulis pertanyaan…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();kAsk()}"></textarea><button class="btn" onclick="kAsk()" ${KBUSY?'disabled':''} aria-label="Kirim">${ic('send',17)}</button></div>
 <div class="fx jb ac mt1"><button class="btn3 xs" onclick="KC=[];saveKC();render()">Bersihkan percakapan</button><span class="mu xs">Riwayat hanya di perangkat ini</span></div></div>
 <details class="cd mt2"><summary style="cursor:pointer;font-weight:600">Yang aku ingat tentangmu (${S.KN?S.KN.length:'…'})</summary><p class="mu xs mt1">Fakta yang kupelajari dari percakapan. Hapus yang salah supaya saranku tetap tepat.</p>${(S.KN||[]).map(n=>`<div class="row fx jb ac g2" style="padding:.45rem 0"><span class="sm">${E(n.Text)}</span><button class="btn3 rd xs" onclick="noteDel('${n.ID}')" aria-label="Hapus">${ic('trash',13)}</button></div>`).join('')||'<p class="mu sm mt1">Belum ada.</p>'}</details>`}
async function kAsk(q,mode){if(KBUSY)return;const inp=$('#kq');q=q!=null&&q!==''?q:(inp?inp.value.trim():'');if(!q&&!mode)return;if(inp)inp.value='';
 KTB='c';KC.push({r:'u',t:q||(mode=='PLAN'?'Rencana gesek bulan ini':'Rapor siklus')});KBUSY=1;saveKC();render();
 try{const r=await call('api_consult',[{q:mode?'':q,mode:mode||'CHAT',history:KC.slice(-7,-1).map(m=>({r:m.r,t:m.t}))}]);KC.push({r:'a',t:r.answer,actions:r.actions,learned:r.learned});if(r.learned&&r.learned.length)S.KN=null}
 catch(e){KC.push({r:'a',t:'⚠ '+e.message})}KBUSY=0;saveKC();render()}

 const cbT=R0.cashback.reduce((s,x)=>s+x.amount,0),miss=R0.promos.reduce((s,p)=>s+(p.prev&&!p.prev.met?p.prev.missed:0),0);

 ${R0.fees.length?`<details class="mt1"><summary class="btn3 xs" style="cursor:pointer">Rincian ${R0.fees.length} biaya</summary>${R0.fees.map(f=>`<div class="fx jb g2 xs" style="padding:.2rem 0"><span>${fdd(f.date)} · ${E(f.card)} · ${E(f.merchant)}</span><span class="nw">${rp(f.amount)}</span></div>`).join('')}</details>`:''}</div>
 <div class="fx fc" style="gap:.8rem"><div class="cd"><b>Hasil promo</b>${R0.promos.map(p=>`<div class="row" style="padding:.5rem 0"><div class="fx jb g2"><span class="sm">${E(p.title)} <span class="mu xs">· ${E(p.card)}</span></span><span class="pill ${p.now.met?'gn':''}">${p.now.pct}% sekarang</span></div>${p.prev?`<div class="xs ${p.prev.met?'gn':'rd'} mt1">Periode lalu: ${p.prev.met?'✓ tercapai':'✗ terlewat'+(p.prev.short.length?' — '+E(p.prev.short.join(', ')):'')}</div>`:''}</div>`).join('')||'<p class="mu sm mt1">Belum ada promo dipantau.</p>'}</div>

 ${R0.idle.length?`<div class="cd"><b>Kartu nganggur 3 bulan</b>${R0.idle.map(c=>`<div class="row fx jb sm" style="padding:.4rem 0"><span>${E(c.name)}</span><span class="${c.annualFee?'am':'mu'}">${c.annualFee?'iuran '+rp(c.annualFee):'tanpa iuran'}</span></div>`).join('')}<div class="mu xs mt1">Pertimbangkan tutup kartu berbayar yang tidak dipakai.</div></div>`:''}
 <button class="btn" onclick="kAsk('','REVIEW')">${ic('spark',16)} Minta analisis & 3 aksi prioritas</button></div></div>`}

 return `<div class="cd" style="max-width:40rem"><b>Profil konsultan</b><p class="mu sm mt1">Semakin aku kenal kamu, semakin tepat saran kartu, cashback & arus kasnya. Semua opsional.</p>
 <label class="lb">1. Prioritas utama</label><div>${[['cashback','💸 Cashback'],['miles','✈️ Miles'],['cashflow','🌊 Arus kas aman'],['mix','⚖️ Campur']].map(([k,l])=>`<button class="chip ${pr==k?'on':''}" onclick="FM.kpr='${k}';render()">${l}</button>`).join('')}</div>
