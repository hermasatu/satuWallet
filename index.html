<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>booq.id — Rekap Kartu Kredit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ====== token ====== */
:root{color-scheme:light;--bg:#eef1f5;--surface:#fff;--sunk:#f6f8fb;--ink:#14213d;--ink2:#4a5672;--line:#d8dee8;--line2:#e9edf3;
 --neg:#0f7b5f;--warn:#c2410c;--focus:#2563eb;--btn:#14213d;--btnInk:#fff;
 --p-WGC:#0e7490;--p-HER:#4338ca;--p-AFL:#a21caf;--p-WGF:#64748b;--p-TITIP:#b45309;--p-X:#94a3b8;
 --r1:6px;--r2:10px;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1524;--surface:#172036;--sunk:#121a2c;--ink:#e6ebf5;--ink2:#9aa6bf;--line:#2b3753;--line2:#222c44;
 --neg:#34d399;--warn:#fb923c;--focus:#60a5fa;--btn:#e6ebf5;--btnInk:#0f1524;--p-WGC:#22b5cf;--p-HER:#818cf8;--p-AFL:#e879f9;--p-WGF:#94a3b8;--p-TITIP:#f59e0b}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.neg{color:var(--neg)} .warn{color:var(--warn)} .mu{color:var(--ink2)} .sm{font-size:13px}
h1,h2,h3{margin:0;letter-spacing:-.01em} h1{font-size:26px;font-weight:800} h2{font-size:19px;font-weight:700} h3{font-size:16px;font-weight:700}
/* ====== shell ====== */
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
@media (prefers-color-scheme:dark){.rail{background:#0b1120}}
.brand{font-weight:800;font-size:20px;margin:0 8px 18px}.brand small{display:block;font-weight:500;font-size:12px;opacity:.7}
.rail button{all:unset;cursor:pointer;padding:9px 10px;border-radius:var(--r1);opacity:.78}.rail button[aria-current]{background:rgba(255,255,255,.12);opacity:1;font-weight:600}
.rail button:focus-visible{outline:2px solid #93c5fd}
.main{padding:24px clamp(14px,3vw,36px) 120px;max-width:1240px;width:100%}
.tabs{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}.rail{display:none}.main{padding:16px 12px 120px}
 .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
 .tabs button{all:unset;flex:1;text-align:center;padding:8px 2px;font-size:12px;font-weight:600;color:var(--ink2);border-radius:var(--r1)}.tabs button[aria-current]{color:var(--ink);background:var(--sunk)}}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btnInk);padding:8px 14px;border-radius:var(--r1);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--ink2)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.danger{background:transparent;color:var(--warn);border-color:currentColor}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:var(--r1);padding:7px 9px;min-width:0;width:100%}
.inp:focus{border-color:var(--focus);outline:none}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2)}label.f .inp{margin-top:4px;font-weight:400;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--p-X));flex:none}
.empty{padding:28px;text-align:center;color:var(--ink2)}
/* ====== split bar (elemen utama) ====== */
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--line2);margin:10px 0 14px}
.split span{background:var(--pc);min-width:2px}
.payers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.payer{border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:var(--r1);padding:10px 12px;background:var(--surface)}
.payer .big{font-size:21px;font-weight:800}.bar{height:5px;background:var(--line2);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--pc)}
/* ====== tagihan ====== */
.stmt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);margin-top:12px;overflow:hidden}
.stmt>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.stmt>summary::-webkit-details-marker{display:none}
.stmt[open]>summary{border-bottom:1px solid var(--line)}
.sname{font-weight:700}.sname small{font-weight:500;color:var(--ink2)}
.state{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.state.PAID{color:var(--neg);border-color:currentColor}.state.NO_BILL{color:var(--ink2)}.state.OPEN{color:var(--warn);border-color:currentColor}
.sbody{padding:12px 14px}
.ledger{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r1)}
table.l{border-collapse:collapse;width:100%;min-width:1040px;font-size:13.5px}
table.l th{background:var(--sunk);text-align:left;font-weight:600;color:var(--ink2);padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:0}
table.l td{border-bottom:1px solid var(--line2);padding:2px 3px;vertical-align:middle}
table.l tr{box-shadow:inset 4px 0 0 var(--pc,transparent)}
table.l td .inp{border-color:transparent;background:transparent;padding:5px 5px}table.l td .inp:hover{border-color:var(--line)}table.l td .inp:focus{border-color:var(--focus);background:var(--surface)}
table.l tr.split td:nth-child(3) .inp{padding-left:16px}
.amt{text-align:right;font-variant-numeric:tabular-nums}
.ic{border:0;background:transparent;cursor:pointer;color:var(--ink2);padding:4px 6px;border-radius:4px}.ic:hover{background:var(--sunk);color:var(--ink)}
.sub{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 16px;margin-top:10px;font-size:13px}
.sub div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line2);padding:2px 0}
.check{margin-top:10px;padding:8px 10px;border-radius:var(--r1);font-size:13.5px;background:var(--sunk)}
.check.bad{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}.check.good{color:var(--neg);background:color-mix(in srgb,var(--neg) 10%,transparent)}
.dirty{color:var(--warn);font-weight:600;font-size:13px}
/* ====== modal / toast ====== */
.ov{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media (min-width:640px){.ov{align-items:center}}
.md{background:var(--surface);border-radius:var(--r2);padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--r1);z-index:60;font-weight:600;max-width:90vw}
/* ====== catatan developer ====== */
.dnb{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(10,15,30,.28)}
.dnb b{background:var(--warn);color:#fff;border-radius:999px;padding:0 7px;margin-left:6px;font-size:12px}
@media (max-width:820px){.dnb{bottom:calc(76px + env(safe-area-inset-bottom));right:12px;padding:9px 13px}}
.dnp{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:min(420px,calc(100vw - 24px));max-height:min(72vh,640px);overflow:auto;z-index:41;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 14px 40px rgba(10,15,30,.3);padding:14px}
@media (max-width:820px){.dnp{right:12px;bottom:calc(126px + env(safe-area-inset-bottom))}}
.note{border-top:1px solid var(--line2);padding:8px 0}.note p{margin:2px 0;white-space:pre-wrap}
.pri-HIGH{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.split span{transition:flex-grow .4s}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ================== KONFIGURASI (isi sekali) ================== */
const API_URL = 'https://vfryxascchrmfikjpoxd.supabase.co/functions/v1/hyper-service'; // ganti PROJECT-REF dengan Project ID Supabase kamu
const APP_VERSION = 'rekap-cc 2026.10.25';
/* ============================================================= */
const $ = s => document.querySelector(s), E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => (n < 0 ? '−' : '') + 'Rp ' + Math.abs(Math.round(Number(n) || 0)).toLocaleString('id-ID');
const fn = n => (n < 0 ? '-' : '') + Math.abs(Math.round(Number(n) || 0)).toLocaleString('id-ID');
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OKT', 'NOV', 'DEC'];
const perL = p => p ? MON[+p.slice(5, 7) - 1] + p.slice(2, 4) : '';
const perLong = p => p ? ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'][+p.slice(5, 7) - 1] + ' ' + p.slice(0, 4) : '';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const addMon = (p, n) => { const d = new Date(+p.slice(0, 4), +p.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const dshort = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '';
/** "1.234.567" / "1,234,567" / "-50000" / "50.000 CR" / "(50.000)" → Rupiah bulat (null bila kosong / tidak valid) */
function pAmt(v) {
  let t = String(v ?? '').trim(); if (!t) return null; const cr = /\bCR\b|\(.*\)/i.test(t), neg = /^[-−]|-\s*$/.test(t) || cr;
  t = t.replace(/[^\d.,]/g, ''); if (!t) return null;
  const m = t.match(/^(.*?)[.,](\d{1,2})$/); if (m && /[.,]/.test(m[1])) t = m[1]; else if (m && !/[.,]/.test(m[1]) && m[2].length < 3) t = m[1];
  const n = parseInt(t.replace(/[.,]/g, ''), 10); return Number.isFinite(n) ? (neg ? -n : n) : null;
}
let S = { tok: localStorage.getItem('booq_tok') || '', view: 'rekap', rekapId: '', R: null, dirty: {}, hist: null, ongoing: { period: today().slice(0, 7) } };
let busy = 0;
async function api(action, args = {}) {
  busy++; try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, args, token: S.tok }) });
    const j = await r.json().catch(() => ({ ok: false, error: 'Server tidak merespons dengan benar (HTTP ' + r.status + ')' }));
    if (j.auth) { S.tok = ''; localStorage.removeItem('booq_tok'); render(); }
    if (!j.ok) throw new Error(j.error || 'Gagal'); return j.data;
  } catch (e) { if (e instanceof TypeError) throw new Error('Tidak bisa terhubung ke server. Cek internet / API_URL.'); throw e; } finally { busy--; }
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function modal(html) { closeModal(); const o = document.createElement('div'); o.className = 'ov'; o.id = 'ov'; o.innerHTML = `<div class="md" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); }); document.body.appendChild(o); setTimeout(() => (o.querySelector('[autofocus]') || o.querySelector('input,select,textarea,button'))?.focus(), 0); }
function closeModal() { $('#ov')?.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#ov')) closeModal(); else if (DN.open) { DN.open = false; renderDN(); } }
  if (e.altKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); DN.open = true; renderDN(); setTimeout(() => $('#dn_body')?.focus(), 0); } });
window.addEventListener('beforeunload', e => { if (Object.keys(S.dirty).length) { e.preventDefault(); e.returnValue = ''; } });
/* ================== data turunan ================== */
const payerOf = l => l.payer_override || (S.cats.find(c => c.code === l.category) || {}).payer_code || '';
const pc = code => S.payers.some(p => p.code === code) && ['WGC', 'HER', 'AFL', 'WGF', 'TITIP'].includes(code) ? `var(--p-${code})` : 'var(--p-X)';
const card = id => S.cards.find(c => c.id === id) || { bank: '?', name: '?' };
const cardName = c => (c.bank + ' ' + c.name + (c.last4 ? ' ••' + c.last4 : '') + (c.holder ? ' · ' + c.holder : '')).trim();
const linesOf = sid => S.R ? (S.edit[sid] || S.R.lines.filter(l => l.statement_id === sid)) : [];
/** Ringkasan satu rekap: total per kategori, per pembayar, transfer per pembayar, sisa */
function summarize() {
  const byCat = {}, byPayer = {}, trf = {}; let all = 0, bank = 0, paid = 0, open = 0;
  S.R.statements.forEach(st => { const ls = linesOf(st.id); ls.forEach(l => { const a = Number(l.amount) || 0, p = payerOf(l) || '—'; byCat[l.category] = (byCat[l.category] || 0) + a; byPayer[p] = (byPayer[p] || 0) + a; all += a; });
    if (st.state !== 'NO_BILL') { bank += Number(st.bank_total ?? ls.reduce((q, l) => q + (Number(l.amount) || 0), 0)); if (st.state === 'PAID') paid++; else open++; } });
  S.R.transfers.forEach(t => { trf[t.payer_code] = (trf[t.payer_code] || 0) + Number(t.amount); });
  return { byCat, byPayer, trf, all, bank, paid, open };
}
/* ================== render ================== */
function render() {
  const root = $('#root');
  if (!S.tok) { root.innerHTML = loginH(); return; }
  if (!S.boot) { root.innerHTML = `<div class="empty">Memuat…</div>`; boot(); return; }
  const nav = [['rekap', 'Rekap bulanan'], ['ongoing', 'Bulan berjalan'], ['cards', 'Kartu'], ['settings', 'Pengaturan']];
  root.innerHTML = `<div class="app"><nav class="rail" aria-label="Menu"><div class="brand">booq.id<small>Rekap kartu kredit</small></div>${nav.map(([k, l]) => `<button onclick="go('${k}')" ${S.view === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}
   <div class="grow"></div><button onclick="logout()">Keluar</button></nav><main class="main" id="main">${({ rekap: rekapV, ongoing: ongoingV, cards: cardsV, settings: settingsV })[S.view]()}</main></div>
   <nav class="tabs" aria-label="Menu">${nav.map(([k, l]) => `<button onclick="go('${k}')" ${S.view === k ? 'aria-current="page"' : ''}>${l.split(' ')[0]}</button>`).join('')}</nav>`;
  renderDN();
}
function go(v) { if (Object.keys(S.dirty).length && !confirm('Ada baris tagihan yang belum disimpan. Tinggalkan halaman ini?')) return; S.dirty = {}; S.edit = {}; S.view = v; S.rekapId = ''; S.R = null; render(); if (v === 'ongoing') loadOngoing(); window.scrollTo(0, 0); }
async function boot() { try { const b = await api('boot'); Object.assign(S, { boot: b, cards: b.cards, payers: b.payers, cats: b.categories, rekaps: b.rekaps }); DN.count = b.openNotes; render(); } catch (e) { $('#root').innerHTML = `<div class="empty">${E(e.message)}<p><button class="btn" onclick="location.reload()">Coba lagi</button></p></div>`; } }
function loginH() {
  return `<main class="main" style="max-width:420px;margin:8vh auto"><h1>booq.id</h1><p class="mu">Rekap tagihan kartu kredit bulanan.</p><form class="panel stack" onsubmit="event.preventDefault();doLogin(false)">
  <label class="f">Email<input class="inp" id="l_e" type="email" autocomplete="username" required autofocus></label>
  <label class="f">Password<input class="inp" id="l_p" type="password" autocomplete="current-password" minlength="8" required></label>
  <p class="warn sm" id="l_err" role="alert"></p><button class="btn" style="width:100%">Masuk</button>
  <button type="button" class="btn ghost" style="width:100%" onclick="doLogin(true)">Buat akun pemilik (pertama kali)</button></form></main>`;
}
async function doLogin(reg) { const e = $('#l_e').value, p = $('#l_p').value; $('#l_err').textContent = '';
  try { const r = await api(reg ? 'auth.register' : 'auth.login', { email: e, password: p, name: e.split('@')[0] }); S.tok = r.token; localStorage.setItem('booq_tok', r.token); S.boot = null; render(); } catch (x) { $('#l_err').textContent = x.message; } }
async function logout() { try { await api('auth.logout'); } catch (e) { } S.tok = ''; localStorage.removeItem('booq_tok'); S.boot = null; render(); }
/* ---------- REKAP ---------- */
function rekapV() {
  if (S.rekapId) return S.R && S.R.rekap.id === S.rekapId ? rekapDetailH() : (loadRekap(S.rekapId), `<div class="empty">Memuat rekap…</div>`);
  const last = S.rekaps[0], next = last ? addMon(last.period, 1) : today().slice(0, 7);
  return `<div class="top"><div><h1>Rekap bulanan</h1><p class="mu sm">Satu rekap per bulan berisi tagihan semua kartu.</p></div>
   <div class="row"><input class="inp" type="month" id="np" value="${next}" style="width:auto" aria-label="Periode rekap"><button class="btn" onclick="newRekap()">Buat rekap</button></div></div>
   ${S.cards.filter(c => c.active).length ? '' : `<div class="panel">Tambahkan kartu dulu di menu <b>Kartu</b>, supaya rekap baru otomatis berisi tagihan tiap kartu.</div>`}
   <div class="panel" style="padding:0">${S.rekaps.length ? S.rekaps.map(r => `<button class="row" style="all:unset;display:flex;justify-content:space-between;width:100%;box-sizing:border-box;padding:12px 16px;border-bottom:1px solid var(--line2);cursor:pointer" onclick="openRekap('${r.id}')">
     <span><b>${perL(r.period)}</b> <span class="mu">${perLong(r.period)}</span></span><span class="row"><span class="mu sm">${r.n_stmt} tagihan</span><span class="state ${r.status === 'FINAL' ? 'PAID' : 'OPEN'}">${r.status === 'FINAL' ? 'Final' : 'Draft'}</span></span></button>`).join('')
    : `<div class="empty">Belum ada rekap. Pilih bulan lalu tekan <b>Buat rekap</b>.</div>`}</div>`;
}
async function newRekap() { const p = $('#np').value; if (!p) return toast('Pilih bulan');
  try { const r = await api('rekap.create', { period: p }); S.rekaps.unshift({ ...r.rekap, n_stmt: S.cards.filter(c => c.active).length }); S.rekaps.sort((a, b) => a.period < b.period ? 1 : -1); toast('Rekap ' + perL(p) + ' dibuat'); openRekap(r.rekap.id); } catch (e) { toast(e.message); } }
function openRekap(id) { S.rekapId = id; S.R = null; S.edit = {}; S.dirty = {}; render(); }
async function loadRekap(id) { try { S.R = await api('rekap.get', { id }); if (!S.hist) api('history.categories').then(h => { S.hist = h.history; }).catch(() => { }); render(); } catch (e) { toast(e.message); S.rekapId = ''; render(); } }
function rekapDetailH() {
  const R = S.R, fin = R.rekap.status === 'FINAL', sm = summarize();
  const pays = S.payers.filter(p => sm.byPayer[p.code] || sm.trf[p.code]).concat(sm.byPayer['—'] ? [{ code: '—', name: 'Tanpa pembayar' }] : []);
  const pos = pays.map(p => Math.max(0, sm.byPayer[p.code] || 0)), totPos = pos.reduce((a, b) => a + b, 0) || 1;
  return `<div class="top"><div><button class="btn ghost sm" onclick="go('rekap')">← Semua rekap</button><h1 style="margin-top:8px">Rekap ${perL(R.rekap.period)}</h1><p class="mu sm">${perLong(R.rekap.period)} · ${R.statements.length} kartu · ${sm.paid} lunas, ${sm.open} belum</p></div>
   <div class="row"><button class="btn ghost" onclick="exportXlsx()">Unduh Excel</button>${fin ? `<button class="btn ghost" onclick="setFinal(false)">Buka kunci</button>` : `<button class="btn" onclick="setFinal(true)">Tandai final</button>`}</div></div>

function exportXlsx() { if (!window.XLSX) return toast('Pustaka Excel belum termuat — cek internet'); const R = S.R, sm = summarize(), A = [];

    ls.forEach(l => { A.push([l.trx_date || '', l.post_date || '', l.merchant, l.location, Number(l.amount), l.note, l.category, payerOf(l)]); byCat[l.category] = (byCat[l.category] || 0) + Number(l.amount); });
    Object.keys(byCat).forEach(k => A.push(['', '', '', '', '', k, byCat[k]])); A.push(['', '', 'JUMLAH BARIS', '', ls.reduce((q, l) => q + Number(l.amount), 0), 'Total bank', st.bank_total ?? '']); A.push([]); });
  A.push(['RINGKASAN PEMBAYAR'], ['Pembayar', 'Tagihan', 'Sudah transfer', 'Sisa']); S.payers.forEach(p => { const b = sm.byPayer[p.code] || 0, t = sm.trf[p.code] || 0; if (b || t) A.push([p.code + ' ' + p.name, b, t, b - t]); });
  A.push([], ['MUTASI'], ['Tanggal', 'Pembayar', 'Dari', 'Ke', 'Nominal', 'Catatan']); R.transfers.forEach(t => A.push([t.trf_date || '', t.payer_code, t.from_account, t.to_account, Number(t.amount), t.note]));
  const ws = XLSX.utils.aoa_to_sheet(A); ws['!cols'] = [{ wch: 14 }, { wch: 14 }, { wch: 40 }, { wch: 16 }, { wch: 14 }, { wch: 24 }, { wch: 14 }, { wch: 10 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, perL(R.rekap.period)); XLSX.writeFile(wb, 'Rekap_CC_' + perL(R.rekap.period) + '.xlsx'); }

  <section class="panel"><div class="row"><h2 class="grow">Pembayar</h2><button class="btn ghost sm" onclick="payerForm()">+ Pembayar</button></div><div style="margin-top:8px">${S.payers.map(p => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line2)"><span class="dot" style="--pc:${pc(p.code)}"></span><b style="width:60px">${E(p.code)}</b><span class="grow">${E(p.name)} <span class="mu sm">${E(p.account)}</span></span><button class="btn ghost sm" onclick="payerForm('${p.code}')">Ubah</button></div>`).join('')}</div></section>
  <section class="panel" style="margin-top:12px"><div class="row"><h2 class="grow">Kategori</h2><button class="btn ghost sm" onclick="catForm()">+ Kategori</button></div><div style="margin-top:8px">${S.cats.map(k => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line2)"><b style="width:110px">${E(k.code)}</b><span class="grow">${E(k.label)}</span><span class="chip"><span class="dot" style="--pc:${pc(k.payer_code)}"></span>${E(k.payer_code || 'tanpa pembayar')}</span><button class="btn ghost sm" onclick="catForm('${k.code}')">Ubah</button></div>`).join('')}</div></section>
  <section class="panel" style="margin-top:12px"><h2>Akun</h2><p class="sm mu">Masuk sebagai ${E(S.boot.me.email)} · versi ${APP_VERSION}</p><button class="btn ghost" onclick="logout()">Keluar</button></section>`; }
function payerForm(code) { const p = code ? S.payers.find(x => x.code === code) : { code: '', name: '', account: '', sort: S.payers.length + 1 };
  modal(`<h2>${code ? 'Ubah' : 'Tambah'} pembayar</h2><div class="grid2" style="margin-top:12px"><label class="f">Kode<input class="inp" id="p_c" value="${E(p.code)}" ${code ? 'readonly' : ''} placeholder="WGC"></label><label class="f">Nama<input class="inp" id="p_n" value="${E(p.name)}"></label><label class="f">Rekening biasa<input class="inp" id="p_a" value="${E(p.account)}" placeholder="*2488"></label><label class="f">Urutan<input class="inp" id="p_s" value="${p.sort}"></label></div>
   <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="payerSave()">Simpan</button></div>`); }
async function payerSave() { try { const r = await api('payer.save', { code: $('#p_c').value, name: $('#p_n').value, account: $('#p_a').value, sort: parseInt($('#p_s').value) || 0 }); const i = S.payers.findIndex(x => x.code === r.payer.code); if (i >= 0) S.payers[i] = r.payer; else S.payers.push(r.payer); closeModal(); render(); toast('Pembayar tersimpan'); } catch (e) { toast(e.message); } }
function catForm(code) { const k = code ? S.cats.find(x => x.code === code) : { code: '', label: '', payer_code: '', kind: 'EXPENSE', sort: S.cats.length + 1 };
  modal(`<h2>${code ? 'Ubah' : 'Tambah'} kategori</h2><div class="grid2" style="margin-top:12px"><label class="f">Kode<input class="inp" id="k_c" value="${E(k.code)}" ${code ? 'readonly' : ''} placeholder="GUDANG"></label><label class="f">Nama<input class="inp" id="k_l" value="${E(k.label)}"></label>
   <label class="f">Ditanggung oleh<select class="inp" id="k_p"><option value="">Tanpa pembayar</option>${S.payers.map(p => `<option value="${p.code}" ${p.code === k.payer_code ? 'selected' : ''}>${E(p.code)} · ${E(p.name)}</option>`).join('')}</select></label>
   <label class="f">Jenis<select class="inp" id="k_k">${[['EXPENSE', 'Pengeluaran'], ['BALANCE', 'Saldo / tagihan lalu'], ['PAYMENT', 'Pembayaran'], ['CREDIT', 'Kredit / cashback']].map(([v, l]) => `<option value="${v}" ${k.kind === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label><label class="f">Urutan<input class="inp" id="k_s" value="${k.sort}"></label></div>
   <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="catSave()">Simpan</button></div>`); }
async function catSave() { try { const r = await api('category.save', { code: $('#k_c').value, label: $('#k_l').value, payer_code: $('#k_p').value, kind: $('#k_k').value, sort: parseInt($('#k_s').value) || 0 }); const i = S.cats.findIndex(x => x.code === r.category.code); if (i >= 0) S.cats[i] = r.category; else S.cats.push(r.category); S.cats.sort((a, b) => a.sort - b.sort); closeModal(); render(); toast('Kategori tersimpan'); } catch (e) { toast(e.message); } }
/* ================== WIDGET CATATAN DEVELOPER ================== */
const DN = { open: false, notes: null, count: 0, draft: localStorage.getItem('booq_dn_draft') || '' };
const pageName = () => ({ rekap: S.rekapId && S.R ? 'Rekap ' + perL(S.R.rekap.period) : 'Rekap bulanan', ongoing: 'Bulan berjalan', cards: 'Kartu', settings: 'Pengaturan' })[S.view] || S.view;
function renderDN() { if (!S.tok || !S.boot) return; let b = $('#dnb'), p = $('#dnp');
  if (!b) { b = document.createElement('button'); b.id = 'dnb'; b.className = 'dnb'; b.onclick = () => { DN.open = !DN.open; renderDN(); if (DN.open) { loadDN(); setTimeout(() => $('#dn_body')?.focus(), 0); } }; document.body.appendChild(b); }
  b.innerHTML = 'Catatan dev' + (DN.count ? `<b>${DN.count}</b>` : ''); b.setAttribute('aria-expanded', DN.open); b.title = 'Catat perubahan yang kamu mau (Alt+N)';
  if (!DN.open) { p?.remove(); return; }
  if (!p) { p = document.createElement('div'); p.id = 'dnp'; p.className = 'dnp'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Catatan developer'); document.body.appendChild(p); }
  const open = (DN.notes || []).filter(n => n.status === 'OPEN'), sent = (DN.notes || []).filter(n => n.status === 'SENT');
  p.innerHTML = `<div class="row"><h3 class="grow">Catatan developer</h3><button class="ic" onclick="DN.open=false;renderDN()" aria-label="Tutup">✕</button></div>
   <p class="mu sm" style="margin:2px 0 8px">Tulis perubahan yang kamu mau di halaman ini. Kalau sudah, tekan <b>Salin untuk Claude</b> lalu tempel di chat.</p>
   <textarea class="inp" id="dn_body" rows="3" placeholder="Contoh: di tabel tagihan, tombol Pecah terlalu kecil di HP" oninput="localStorage.setItem('booq_dn_draft',this.value)">${E(DN.draft)}</textarea>
   <div class="row" style="margin-top:6px"><span class="chip">${E(pageName())}</span><select class="inp" id="dn_pri" style="width:auto"><option value="NORMAL">Biasa</option><option value="HIGH">Penting</option><option value="LOW">Nanti saja</option></select><span class="grow"></span><button class="btn sm" onclick="saveDN()">Simpan catatan</button></div>
   <div class="row" style="margin-top:12px"><b class="grow">${open.length} belum dikirim</b><button class="btn ghost sm" onclick="copyDN()" ${open.length ? '' : 'disabled'}>Salin untuk Claude</button></div>
   ${DN.notes === null ? '<p class="mu sm">Memuat…</p>' : open.map(noteH).join('') || '<p class="mu sm">Tidak ada catatan baru.</p>'}
   ${sent.length ? `<details style="margin-top:8px"><summary class="sm" style="cursor:pointer">${sent.length} sudah dikirim, menunggu dikerjakan</summary>${sent.map(noteH).join('')}<button class="btn ghost sm" onclick="copyDN(true)">Salin ulang yang terkirim</button></details>` : ''}`; }
function noteH(n) { return `<div class="note"><div class="row sm"><b class="grow ${'pri-' + n.priority}">${E(n.page)}${n.priority === 'HIGH' ? ' · penting' : ''}</b><span class="mu">${new Date(n.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</span></div><p>${E(n.body)}</p>
  <div class="row">${n.status !== 'DONE' ? `<button class="ic sm" onclick="statusDN('${n.id}','DONE')">Tandai selesai</button>` : ''}${n.status === 'SENT' ? `<button class="ic sm" onclick="statusDN('${n.id}','OPEN')">Kembalikan ke baru</button>` : ''}<button class="ic sm" onclick="delDN('${n.id}')">Hapus</button></div></div>`; }
async function loadDN() { try { DN.notes = (await api('note.list')).notes; DN.count = DN.notes.filter(n => n.status === 'OPEN').length; renderDN(); } catch (e) { toast(e.message); } }
async function saveDN() { const body = $('#dn_body').value.trim(); if (!body) return toast('Tulis catatannya dulu');
  const ctx = { view: S.view, rekap: S.R && S.rekapId ? S.R.rekap.period : '', openStatement: S.openStmt ? cardName(card((S.R?.statements || []).find(s => s.id === S.openStmt)?.card_id)) : '', screen: innerWidth + 'x' + innerHeight, version: APP_VERSION };
  try { await api('note.save', { page: pageName(), body, priority: $('#dn_pri').value, context: ctx }); DN.draft = ''; localStorage.removeItem('booq_dn_draft'); toast('Catatan tersimpan'); await loadDN(); } catch (e) { toast(e.message); } }
/** Format yang ditempel ke chat Claude: konteks aplikasi + daftar permintaan per halaman */
function dnText(list) { const by = {}; list.forEach(n => (by[n.page] = by[n.page] || []).push(n));
  return ['## Catatan developer booq.id (Rekap Kartu Kredit)', 'Versi: ' + APP_VERSION + ' · dikirim ' + new Date().toLocaleString('id-ID'), '',
    ...Object.keys(by).flatMap(pg => ['### ' + pg, ...by[pg].map((n, i) => (i + 1) + '. ' + (n.priority === 'HIGH' ? '[PENTING] ' : n.priority === 'LOW' ? '[nanti] ' : '') + n.body.replace(/\n/g, '\n   ') +
      (n.context && (n.context.rekap || n.context.openStatement) ? '\n   _(konteks: ' + [n.context.rekap && 'rekap ' + n.context.rekap, n.context.openStatement].filter(Boolean).join(', ') + ')_' : '')), '']), 'Tolong kerjakan perubahan di atas pada file booq.id (index.html / Edge Function booq / migrasi SQL).'].join('\n'); }
async function copyDN(resend) { const list = (DN.notes || []).filter(n => n.status === (resend ? 'SENT' : 'OPEN')); if (!list.length) return; const t = dnText(list);
  try { await navigator.clipboard.writeText(t); } catch (e) { modal(`<h2>Salin catatan</h2><p class="sm mu">Browser tidak mengizinkan salin otomatis. Blok teks di bawah lalu salin manual.</p><textarea class="inp" rows="12" readonly onfocus="this.select()">${E(t)}</textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">Selesai</button></div>`); }
  if (!resend) { try { await api('note.status', { ids: list.map(n => n.id), status: 'SENT' }); } catch (e) { toast(e.message); } }
  toast(list.length + ' catatan disalin — tempel di chat Claude'); await loadDN(); }
async function statusDN(id, st) { try { await api('note.status', { ids: [id], status: st }); await loadDN(); } catch (e) { toast(e.message); } }
async function delDN(id) { if (!confirm('Hapus catatan ini?')) return; try { await api('note.delete', { id }); await loadDN(); } catch (e) { toast(e.message); } }
render();
</script>
</body>
</html>
