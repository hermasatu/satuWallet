<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>booq.id — Rekap Kartu Kredit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ====== token ====== */
:root{color-scheme:light;--bg:#eef1f5;--surface:#fff;--sunk:#f6f8fb;--ink:#14213d;--ink2:#4a5672;--line:#d8dee8;--line2:#e9edf3;
 --neg:#0f7b5f;--warn:#c2410c;--focus:#2563eb;--btn:#14213d;--btnInk:#fff;
 --p-WGC:#0e7490;--p-HER:#4338ca;--p-AFL:#a21caf;--p-WGF:#64748b;--p-TITIP:#b45309;--p-X:#94a3b8;
 --r1:6px;--r2:10px;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1524;--surface:#172036;--sunk:#121a2c;--ink:#e6ebf5;--ink2:#9aa6bf;--line:#2b3753;--line2:#222c44;
 --neg:#34d399;--warn:#fb923c;--focus:#60a5fa;--btn:#e6ebf5;--btnInk:#0f1524;--p-WGC:#22b5cf;--p-HER:#818cf8;--p-AFL:#e879f9;--p-WGF:#94a3b8;--p-TITIP:#f59e0b}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.neg{color:var(--neg)} .warn{color:var(--warn)} .mu{color:var(--ink2)} .sm{font-size:13px}
h1,h2,h3{margin:0;letter-spacing:-.01em} h1{font-size:26px;font-weight:800} h2{font-size:19px;font-weight:700} h3{font-size:16px;font-weight:700}
/* ====== shell ====== */
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
@media (prefers-color-scheme:dark){.rail{background:#0b1120}}
.brand{font-weight:800;font-size:20px;margin:0 8px 18px}.brand small{display:block;font-weight:500;font-size:12px;opacity:.7}
.rail button{all:unset;cursor:pointer;padding:9px 10px;border-radius:var(--r1);opacity:.78}.rail button[aria-current]{background:rgba(255,255,255,.12);opacity:1;font-weight:600}
.rail button:focus-visible{outline:2px solid #93c5fd}
.main{padding:24px clamp(14px,3vw,36px) 120px;max-width:1240px;width:100%}
.tabs{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}.rail{display:none}.main{padding:16px 12px 120px}
 .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
 .tabs button{all:unset;flex:1;text-align:center;padding:8px 2px;font-size:12px;font-weight:600;color:var(--ink2);border-radius:var(--r1)}.tabs button[aria-current]{color:var(--ink);background:var(--sunk)}}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btnInk);padding:8px 14px;border-radius:var(--r1);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--ink2)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.danger{background:transparent;color:var(--warn);border-color:currentColor}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:var(--r1);padding:7px 9px;min-width:0;width:100%}
.inp:focus{border-color:var(--focus);outline:none}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2)}label.f .inp{margin-top:4px;font-weight:400;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--p-X));flex:none}
.empty{padding:28px;text-align:center;color:var(--ink2)}
/* ====== split bar (elemen utama) ====== */
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--line2);margin:10px 0 14px}
.split span{background:var(--pc);min-width:2px}
.payers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.payer{border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:var(--r1);padding:10px 12px;background:var(--surface)}
.payer .big{font-size:21px;font-weight:800}.bar{height:5px;background:var(--line2);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--pc)}
/* ====== tagihan ====== */
.stmt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);margin-top:12px;overflow:hidden}
.stmt>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.stmt>summary::-webkit-details-marker{display:none}
.stmt[open]>summary{border-bottom:1px solid var(--line)}
.sname{font-weight:700}.sname small{font-weight:500;color:var(--ink2)}
.state{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.state.PAID{color:var(--neg);border-color:currentColor}.state.NO_BILL{color:var(--ink2)}.state.OPEN{color:var(--warn);border-color:currentColor}
.sbody{padding:12px 14px}
.ledger{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r1)}
table.l{border-collapse:collapse;width:100%;min-width:1040px;font-size:13.5px}
table.l th{background:var(--sunk);text-align:left;font-weight:600;color:var(--ink2);padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:0}
table.l td{border-bottom:1px solid var(--line2);padding:2px 3px;vertical-align:middle}
table.l tr{box-shadow:inset 4px 0 0 var(--pc,transparent)}
table.l td .inp{border-color:transparent;background:transparent;padding:5px 5px}table.l td .inp:hover{border-color:var(--line)}table.l td .inp:focus{border-color:var(--focus);background:var(--surface)}
table.l tr.split td:nth-child(3) .inp{padding-left:16px}
.amt{text-align:right;font-variant-numeric:tabular-nums}
.ic{border:0;background:transparent;cursor:pointer;color:var(--ink2);padding:4px 6px;border-radius:4px}.ic:hover{background:var(--sunk);color:var(--ink)}
.sub{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 16px;margin-top:10px;font-size:13px}
.sub div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line2);padding:2px 0}
.check{margin-top:10px;padding:8px 10px;border-radius:var(--r1);font-size:13.5px;background:var(--sunk)}
.check.bad{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}.check.good{color:var(--neg);background:color-mix(in srgb,var(--neg) 10%,transparent)}
.dirty{color:var(--warn);font-weight:600;font-size:13px}
/* ====== modal / toast ====== */
.ov{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media (min-width:640px){.ov{align-items:center}}
.md{background:var(--surface);border-radius:var(--r2);padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--r1);z-index:60;font-weight:600;max-width:90vw}
/* ====== catatan developer ====== */
.dnb{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(10,15,30,.28)}
.dnb b{background:var(--warn);color:#fff;border-radius:999px;padding:0 7px;margin-left:6px;font-size:12px}
@media (max-width:820px){.dnb{bottom:calc(76px + env(safe-area-inset-bottom));right:12px;padding:9px 13px}}
.dnp{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:min(420px,calc(100vw - 24px));max-height:min(72vh,640px);overflow:auto;z-index:41;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 14px 40px rgba(10,15,30,.3);padding:14px}
@media (max-width:820px){.dnp{right:12px;bottom:calc(126px + env(safe-area-inset-bottom))}}
.note{border-top:1px solid var(--line2);padding:8px 0}.note p{margin:2px 0;white-space:pre-wrap}
.pri-HIGH{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.split span{transition:flex-grow .4s}}

/* ===== v2 ===== */
.caps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.cap{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;gap:7px;align-items:center;color:var(--ink)}
.cap[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cap .sd{width:8px;height:8px;border-radius:50%}.sd.PAID{background:var(--neg)}.sd.OPEN{background:var(--warn)}.sd.NO_BILL{background:var(--ink2)}
.cap .x{color:var(--warn);font-weight:800}.cap[aria-pressed="true"] .x{color:#fdba74}
.tools{display:grid;grid-template-columns:2fr repeat(5,minmax(110px,1fr));gap:8px;align-items:end}
@media (max-width:980px){.tools{grid-template-columns:1fr 1fr}}
.tools label{font-size:12px;font-weight:600;color:var(--ink2)}
.foot{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;font-size:13.5px;background:var(--sunk);border-top:1px solid var(--line)}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:15;margin-top:14px;background:var(--ink);color:var(--bg);border-radius:var(--r2);padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(10,15,30,.25)}
.savebar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}.savebar .btn.ghost{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.4)}
@media (max-width:820px){.savebar{bottom:calc(70px + env(safe-area-inset-bottom))}}
.cardtag{font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.st-OPEN{color:var(--focus)}.st-SENT{color:var(--p-HER)}.st-IN_PROGRESS{color:var(--p-WGC)}.st-NEED_INFO{color:var(--warn)}.st-DONE{color:var(--neg)}.st-CANCELLED{color:var(--ink2)}
.rid{font-weight:800;font-size:12px;border:1px solid currentColor;border-radius:5px;padding:0 5px}
.banner{border:1px solid var(--neg);background:color-mix(in srgb,var(--neg) 9%,transparent);border-radius:var(--r1);padding:8px 10px;font-size:13px;margin-bottom:8px}
.drop{border:2px dashed var(--line);border-radius:var(--r2);padding:18px;text-align:center;cursor:pointer;color:var(--ink2)}.drop:hover{border-color:var(--ink2)}
.grp{border:1px solid var(--line);border-radius:var(--r1);padding:10px;margin-top:10px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ================== KONFIGURASI ================== */
const API_URL = 'https://vfryxascchrmfikjpoxd.supabase.co/functions/v1/hyper-service'; // alamat Edge Function kamu
/** Rilis ini: permintaan (catatan developer) yang dikerjakan. Widget menawarkan menandai selesai. */
const RELEASE = { version: 'rekap-cc 2026.10.26', done: ['BQ-001', 'BQ-002', 'BQ-003', 'BQ-004'],
  summary: 'ID & status catatan developer, kelola pembayar, upload PDF + password tersimpan + deteksi kartu, rekap satu halaman dengan filter kapsul kartu, cari lintas bulan' };
const APP_VERSION = RELEASE.version;
/* ================================================= */
const $ = s => document.querySelector(s), E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => (n < 0 ? '−' : '') + 'Rp ' + Math.abs(Math.round(Number(n) || 0)).toLocaleString('id-ID');
const fn = n => (n < 0 ? '-' : '') + Math.abs(Math.round(Number(n) || 0)).toLocaleString('id-ID');
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OKT', 'NOV', 'DEC'];
const perL = p => p ? MON[+p.slice(5, 7) - 1] + p.slice(2, 4) : '';
const perLong = p => p ? ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'][+p.slice(5, 7) - 1] + ' ' + p.slice(0, 4) : '';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const addMon = (p, n) => { const d = new Date(+p.slice(0, 4), +p.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const dshort = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '';
const rid = n => 'BQ-' + String(n || 0).padStart(3, '0');
let KEY = 0; const key = () => 'k' + (++KEY);
/** "1.234.567" / "1,234,567" / "-50000" / "50.000 CR" / "(50.000)" → Rupiah bulat (null bila tidak valid) */
function pAmt(v) {
  let t = String(v ?? '').trim(); if (!t) return null; const cr = /\bCR\b|\(.*\)/i.test(t), neg = /^[-−]|-\s*$/.test(t) || cr;
  t = t.replace(/[^\d.,]/g, ''); if (!t) return null;
  const m = t.match(/^(.*?)[.,](\d{1,2})$/); if (m && /[.,]/.test(m[1])) t = m[1]; else if (m && !/[.,]/.test(m[1]) && m[2].length < 3) t = m[1];
  const n = parseInt(t.replace(/[.,]/g, ''), 10); return Number.isFinite(n) ? (neg ? -n : n) : null;
}
let S = { tok: localStorage.getItem('booq_tok') || '', view: 'rekap', rekapId: '', R: null, edit: {}, dirty: {}, hist: null, ongoing: { period: today().slice(0, 7) },
  f: { cards: [], q: '', payer: '', cat: '', from: '', to: '', sort: 'date_asc', hideBal: false },
  sf: { period_from: addMon(today().slice(0, 7), -3), period_to: today().slice(0, 7), cards: [], q: '', payer: '', category: '', date_from: '', date_to: '', sort: 'date_desc', hideBalance: true }, sr: null };
async function api(action, args = {}) {
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, args, token: S.tok }) });
    const j = await r.json().catch(() => ({ ok: false, error: 'Server tidak merespons dengan benar (HTTP ' + r.status + ')' + (r.status === 401 ? ' — cek "Verify JWT" di Edge Function sudah dimatikan' : '') }));
    if (j.auth) { S.tok = ''; localStorage.removeItem('booq_tok'); render(); }
    if (!j.ok) throw new Error(j.error || 'Gagal'); return j.data;
  } catch (e) { if (e instanceof TypeError) throw new Error('Tidak bisa terhubung ke server. Cek internet / API_URL.'); throw e; }
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3400); }
function modal(html) { closeModal(); const o = document.createElement('div'); o.className = 'ov'; o.id = 'ov'; o.innerHTML = `<div class="md" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o && !o.dataset.sticky) closeModal(); }); document.body.appendChild(o); setTimeout(() => (o.querySelector('[autofocus]') || o.querySelector('input,select,textarea,button'))?.focus(), 0); return o; }
function closeModal() { $('#ov')?.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#ov')) closeModal(); else if (DN.open) { DN.open = false; renderDN(); } }
  if (e.altKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); DN.open = true; renderDN(); loadDN(); setTimeout(() => $('#dn_body')?.focus(), 0); } });
window.addEventListener('beforeunload', e => { if (Object.keys(S.dirty).length) { e.preventDefault(); e.returnValue = ''; } });
/* ================== data turunan ================== */
const payer = code => S.payers.find(p => p.code === code);
const pc = code => (payer(code) || {}).color || 'var(--p-X)';
const catOf = code => S.cats.find(c => c.code === code) || {};
const payerOf = l => l.payer_override || catOf(l.category).payer_code || '';
const card = id => S.cards.find(c => c.id === id) || { bank: '?', name: '?', last4: '' };
const cardName = c => (c.bank + ' ' + c.name + (c.last4 ? ' ••' + c.last4 : '') + (c.holder ? ' · ' + c.holder : '')).trim();
const cardShort = c => (c.bank + ' ' + c.name).trim() + (c.last4 ? ' ••' + c.last4 : '');
const linesOf = sid => S.edit[sid] || [];
const sumOf = ls => ls.reduce((q, l) => q + (Number(l.amount) || 0), 0);
function summarize() {
  const byCat = {}, byPayer = {}, trf = {}; let bank = 0, paid = 0, open = 0;
  S.R.statements.forEach(st => { const ls = linesOf(st.id); ls.forEach(l => { const a = Number(l.amount) || 0, p = payerOf(l) || '—'; byCat[l.category] = (byCat[l.category] || 0) + a; byPayer[p] = (byPayer[p] || 0) + a; });
    if (st.state !== 'NO_BILL') { bank += Number(st.bank_total ?? sumOf(ls)); if (st.state === 'PAID') paid++; else open++; } });
  S.R.transfers.forEach(t => { trf[t.payer_code] = (trf[t.payer_code] || 0) + Number(t.amount); });
  return { byCat, byPayer, trf, bank, paid, open };
}
const diffOf = st => st.bank_total == null ? null : Number(st.bank_total) - sumOf(linesOf(st.id));
/* ================== render ================== */
const NAV = [['rekap', 'Rekap bulanan'], ['search', 'Cari transaksi'], ['ongoing', 'Bulan berjalan'], ['cards', 'Kartu'], ['settings', 'Pengaturan']];
function render() {
  const root = $('#root');
  if (!S.tok) { root.innerHTML = loginH(); return; }
  if (!S.boot) { root.innerHTML = `<div class="empty">Memuat…</div>`; boot(); return; }
  root.innerHTML = `<div class="app"><nav class="rail" aria-label="Menu"><div class="brand">booq.id<small>Rekap kartu kredit</small></div>${NAV.map(([k, l]) => `<button onclick="go('${k}')" ${S.view === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}
   <div class="grow"></div><button onclick="logout()">Keluar</button></nav><main class="main" id="main">${({ rekap: rekapV, search: searchV, ongoing: ongoingV, cards: cardsV, settings: settingsV })[S.view]()}</main></div>
   <nav class="tabs" aria-label="Menu">${NAV.map(([k, l]) => `<button onclick="go('${k}')" ${S.view === k ? 'aria-current="page"' : ''}>${l.split(' ')[0]}</button>`).join('')}</nav>`;
  renderDN();
}
function go(v) { if (Object.keys(S.dirty).length && !confirm('Ada perubahan yang belum disimpan. Tinggalkan halaman ini?')) return;
  S.dirty = {}; S.edit = {}; S.view = v; S.rekapId = ''; S.R = null; render(); if (v === 'ongoing') loadOngoing(); if (v === 'search') runSearch(); if (v === 'settings' || v === 'cards') loadPw(); window.scrollTo(0, 0); }
async function boot() { try { const b = await api('boot'); Object.assign(S, { boot: b, cards: b.cards, payers: b.payers, cats: b.categories, rekaps: b.rekaps }); DN.count = b.openNotes; render(); loadDN(true); }
  catch (e) { $('#root').innerHTML = `<div class="empty">${E(e.message)}<p><button class="btn" onclick="location.reload()">Coba lagi</button></p></div>`; } }
function loginH() {
  return `<main class="main" style="max-width:420px;margin:8vh auto"><h1>booq.id</h1><p class="mu">Rekap tagihan kartu kredit bulanan.</p><form class="panel stack" onsubmit="event.preventDefault();doLogin(false)">
  <label class="f">Email<input class="inp" id="l_e" type="email" autocomplete="username" required autofocus></label>
  <label class="f">Password<input class="inp" id="l_p" type="password" autocomplete="current-password" minlength="8" required></label>
  <p class="warn sm" id="l_err" role="alert"></p><button class="btn" style="width:100%">Masuk</button>
  <button type="button" class="btn ghost" style="width:100%" onclick="doLogin(true)">Buat akun pemilik (pertama kali)</button></form></main>`;
}
async function doLogin(reg) { const e = $('#l_e').value, p = $('#l_p').value; $('#l_err').textContent = '';
  try { const r = await api(reg ? 'auth.register' : 'auth.login', { email: e, password: p, name: e.split('@')[0] }); S.tok = r.token; localStorage.setItem('booq_tok', r.token); S.boot = null; render(); } catch (x) { $('#l_err').textContent = x.message; } }

function renderDN() { if (!S.tok || !S.boot) return; let b = $('#dnb'), p = $('#dnp');
  if (!b) { b = document.createElement('button'); b.id = 'dnb'; b.className = 'dnb'; b.onclick = () => { DN.open = !DN.open; renderDN(); if (DN.open) { loadDN(); setTimeout(() => $('#dn_body')?.focus(), 0); } }; document.body.appendChild(b); }
  const rel = releasePending(); b.innerHTML = 'Catatan dev' + (DN.count ? `<b>${DN.count}</b>` : '') + (rel.length ? ' <b style="background:var(--neg)">✓</b>' : ''); b.setAttribute('aria-expanded', DN.open); b.title = 'Catat perubahan yang kamu mau (Alt+N)';
  if (!DN.open) { p?.remove(); return; }
  if (!p) { p = document.createElement('div'); p.id = 'dnp'; p.className = 'dnp'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Catatan developer'); document.body.appendChild(p); }
  const all = DN.notes || [], list = all.filter(n => DN.tab === 'active' ? NACTIVE.includes(n.status) : DN.tab === 'done' ? n.status === 'DONE' : n.status === 'CANCELLED'), fresh = all.filter(n => n.status === 'OPEN');
  p.innerHTML = `<div class="row"><h3 class="grow">Catatan developer</h3><button class="ic" onclick="DN.open=false;renderDN()" aria-label="Tutup">✕</button></div>
   ${rel.length ? `<div class="banner">Versi ${E(RELEASE.version)} mengerjakan <b>${rel.map(n => rid(n.req_no)).join(', ')}</b>. Sudah dicek sesuai? <button class="btn sm" onclick="releaseDone()">Tandai selesai</button></div>` : ''}
   <textarea class="inp" id="dn_body" rows="3" placeholder="Tulis perubahan yang kamu mau. Contoh: di tabel tagihan, tombol Pecah terlalu kecil di HP" oninput="DN.draft=this.value;localStorage.setItem('booq_dn_draft',this.value)">${E(DN.draft)}</textarea>
   <div class="row" style="margin-top:6px"><span class="chip">${E(pageName())}</span><select class="inp" id="dn_pri" style="width:auto"><option value="NORMAL">Biasa</option><option value="HIGH">Penting</option><option value="LOW">Nanti saja</option></select><span class="grow"></span><button class="btn sm" onclick="saveDN()">Simpan catatan</button></div>
   <div class="row" style="margin-top:12px;gap:4px">${[['active', 'Belum selesai'], ['done', 'Selesai'], ['cancelled', 'Dibatalkan']].map(([k, l]) => `<button class="cap" style="padding:4px 10px" aria-pressed="${DN.tab === k}" onclick="DN.tab='${k}';renderDN()">${l} ${all.filter(n => k === 'active' ? NACTIVE.includes(n.status) : k === 'done' ? n.status === 'DONE' : n.status === 'CANCELLED').length}</button>`).join('')}</div>
   ${DN.tab === 'active' ? `<div class="row" style="margin-top:8px"><button class="btn sm" onclick="copyDN('new')" ${fresh.length ? '' : 'disabled'}>Salin ${fresh.length} yang baru untuk Claude</button><button class="btn ghost sm" onclick="copyDN('all')" ${list.length ? '' : 'disabled'} title="Untuk chat baru: semua yang belum selesai">Salin semua yang belum selesai</button></div>` : ''}
   ${DN.notes === null ? '<p class="mu sm">Memuat…</p>' : list.map(noteH).join('') || '<p class="mu sm" style="margin-top:8px">Kosong.</p>'}`; }
function noteH(n) { return `<div class="note"><div class="row sm"><span class="rid st-${n.status}">${rid(n.req_no)}</span><b class="grow ${'pri-' + n.priority}">${E(n.page)}${n.priority === 'HIGH' ? ' · penting' : ''}</b><span class="mu">${new Date(n.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</span></div><p>${E(n.body)}</p>
  ${n.resolution ? `<p class="sm mu">↳ ${E(n.resolution)}${n.done_version ? ' (' + E(n.done_version) + ')' : ''}</p>` : ''}
  <div class="row"><label class="sm mu">Status</label><select class="inp sm st-${n.status}" style="width:auto;padding:3px 6px" onchange="statusDN('${n.id}',this.value)" aria-label="Status ${rid(n.req_no)}">${Object.entries(NST).map(([k, l]) => `<option value="${k}" ${k === n.status ? 'selected' : ''}>${l}</option>`).join('')}</select><span class="grow"></span><button class="ic sm" onclick="delDN('${n.id}')">Hapus</button></div></div>`; }
function releasePending() { return (DN.notes || []).filter(n => RELEASE.done.includes(rid(n.req_no)) && n.status !== 'DONE' && n.status !== 'CANCELLED'); }
async function releaseDone() { const ids = releasePending().map(n => n.id); try { await api('note.status', { ids, status: 'DONE', version: RELEASE.version, resolution: 'Selesai di ' + RELEASE.version }); toast(ids.length + ' permintaan ditandai selesai'); await loadDN(); } catch (e) { toast(e.message); } }
async function loadDN(quiet) { try { DN.notes = (await api('note.list')).notes; DN.count = DN.notes.filter(n => NACTIVE.includes(n.status)).length; renderDN(); } catch (e) { if (!quiet) toast(e.message); } }
async function saveDN() { const body = $('#dn_body').value.trim(); if (!body) return toast('Tulis catatannya dulu');
  const ctx = { view: S.view, rekap: S.R && S.rekapId ? S.R.rekap.period : '', cards: S.R && S.f.cards.length ? S.f.cards.map(c => cardShort(card(c))).join(', ') : '', screen: innerWidth + 'x' + innerHeight, version: APP_VERSION };
  try { const r = await api('note.save', { page: pageName(), body, priority: $('#dn_pri').value, context: ctx }); DN.draft = ''; localStorage.removeItem('booq_dn_draft'); toast('Tersimpan sebagai ' + rid(r.note.req_no)); await loadDN(); } catch (e) { toast(e.message); } }
/** Teks untuk chat Claude: setiap permintaan punya ID + status supaya tidak tertukar antar chat */
function dnText(list) { const by = {}; list.slice().sort((a, b) => a.req_no - b.req_no).forEach(n => (by[n.page] = by[n.page] || []).push(n));
  return ['## Catatan developer booq.id (Rekap Kartu Kredit)', 'Versi aplikasi: ' + APP_VERSION + ' · dikirim ' + new Date().toLocaleString('id-ID'), 'Kalau ini chat baru, lampirkan juga file KONTEKS-BOOQ.md.', '',
    ...Object.keys(by).flatMap(pg => ['### ' + pg, ...by[pg].map(n => '- **' + rid(n.req_no) + '** [' + NST[n.status] + ']' + (n.priority === 'HIGH' ? ' [PENTING]' : n.priority === 'LOW' ? ' [nanti]' : '') + ' ' + n.body.replace(/\n/g, '\n  ') +
      (n.resolution ? '\n  ↳ ' + n.resolution : '') + (n.context && (n.context.rekap || n.context.cards) ? '\n  _(konteks: ' + [n.context.rekap && 'rekap ' + n.context.rekap, n.context.cards].filter(Boolean).join(', ') + ')_' : '')), '']),
    'Tolong kerjakan permintaan di atas pada booq.id (index.html / Edge Function / migrasi SQL). Sebutkan ID yang dikerjakan di laporan, dan masukkan ke RELEASE.done.'].join('\n'); }
async function copyDN(mode) { const list = (DN.notes || []).filter(n => mode === 'new' ? n.status === 'OPEN' : NACTIVE.includes(n.status)); if (!list.length) return; const t = dnText(list);
  try { await navigator.clipboard.writeText(t); } catch (e) { modal(`<h2>Salin catatan</h2><p class="sm mu">Browser tidak mengizinkan salin otomatis. Blok teks di bawah lalu salin manual.</p><textarea class="inp" rows="12" readonly onfocus="this.select()">${E(t)}</textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">Selesai</button></div>`); }
  const fresh = list.filter(n => n.status === 'OPEN').map(n => n.id); if (fresh.length) { try { await api('note.status', { ids: fresh, status: 'SENT' }); } catch (e) { toast(e.message); } }
  toast(list.length + ' permintaan disalin — tempel di chat Claude'); await loadDN(); }
async function statusDN(id, st) { try { await api('note.status', { ids: [id], status: st, version: st === 'DONE' ? APP_VERSION : '' }); await loadDN(); } catch (e) { toast(e.message); } }
async function delDN(id) { if (!confirm('Hapus catatan ini? (ID-nya tidak dipakai ulang)')) return; try { await api('note.delete', { id }); await loadDN(); } catch (e) { toast(e.message); } }
render();

</script>
</body>
</html>
